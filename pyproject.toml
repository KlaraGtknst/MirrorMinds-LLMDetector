[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "llm-detector"
version = "0.1.0"
packages = [
  { include = "llm_question_generator" },
  { include = "llm_response_generator" }
]

[tool.poetry.dependencies]
python = "^3.9"  # or your python version
torch = "*"
torchvision = "*"
torchaudio = "*"
